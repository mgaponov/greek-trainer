<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ακούω · Greek sentence trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=GFS+Didot&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d2427; --bg2:#0a1c1f; --surface:#16383b; --surface2:#1b4145;
  --tile:#f2ead7; --tile-press:#e6dabb; --ink:#17282b;
  --text:#eaf3ef; --muted:#8aa6a3; --line:rgba(255,255,255,.10);
  --accent:#e3a83c; --accent-press:#c9922f;
  --correct:#37b98c; --correct-bg:rgba(55,185,140,.15);
  --wrong:#d9694a; --wrong-bg:rgba(217,105,74,.15);
  --tap:.16s cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;min-height:100%;background:var(--bg2)}
body{
  margin:0;min-height:100dvh;
  background-color:var(--bg2);
  background-image:radial-gradient(120% 80% at 50% -10%,#123033 0%,var(--bg) 55%,var(--bg2) 100%);
  background-repeat:no-repeat;
  background-attachment:fixed;
  color:var(--text);
  font-family:"Commissioner","Noto Sans",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
.app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wordmark{font-family:"GFS Didot",Georgia,serif;letter-spacing:.02em}

/* ---------- HOME ---------- */
#home{padding:28px 20px 40px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.brand{display:flex;align-items:baseline;gap:10px;margin:6px 2px 16px}
.randlesson{width:100%;display:flex;align-items:center;gap:14px;text-align:left;margin:0 0 26px;
  background:var(--surface);border:1px solid rgba(227,168,60,.35);border-radius:16px;padding:14px 16px;
  transition:transform var(--tap),background var(--tap),border-color var(--tap)}
.randlesson:active{transform:scale(.98);background:var(--surface2)}
.rl-badge{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--accent),#f0c268);color:#3a2b06}
.rl-badge svg{width:22px;height:22px}
.rl-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.rl-title{font-weight:700;font-size:16px;color:var(--text)}
.rl-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-go{margin-left:auto;color:var(--accent);font-size:20px;font-weight:700;flex:0 0 auto}
.brand h1{font-family:"GFS Didot",Georgia,serif;font-size:34px;margin:0;font-weight:400}
.brand .sub{color:var(--muted);font-size:13px;font-weight:500}
.reset{margin-left:auto;align-self:center;font-size:12px;font-weight:600;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;
  white-space:nowrap;transition:color var(--tap),border-color var(--tap),background var(--tap)}
.reset:active{background:var(--surface2)}
.reset.arm{color:var(--wrong);border-color:var(--wrong);background:var(--wrong-bg)}
.module{margin-bottom:26px;animation:rise .5s both}
.module h2{font-family:"GFS Didot",Georgia,serif;font-weight:400;font-size:22px;margin:0 2px 4px;
  display:flex;align-items:center;gap:10px}
.module .gk{color:var(--accent);font-size:14px;font-weight:600;font-family:"Commissioner",sans-serif}
.module .count{color:var(--muted);font-size:12px;margin:0 2px 14px}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lesson{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px 16px 15px;text-align:left;transition:transform var(--tap),background var(--tap);
  display:flex;flex-direction:column;gap:10px;min-height:104px;justify-content:space-between}
.lesson:active{transform:scale(.97);background:var(--surface2)}
.lesson .n{width:34px;height:34px;border-radius:11px;background:var(--bg2);color:var(--accent);
  display:grid;place-items:center;font-weight:700;font-size:15px}
.lesson.done .n{background:var(--correct-bg);color:var(--correct)}
.lesson .ttl{font-weight:600;font-size:15px;line-height:1.25}
.lesson .meta{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.check{color:var(--correct)}

/* ---------- PRACTICE ---------- */
#practice{flex:1;display:none;flex-direction:column;padding:14px 18px 0;overflow:hidden;min-height:0}
#stage{flex:1;display:flex;flex-direction:column;min-height:0}
.pscroll{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.top{display:flex;align-items:center;gap:14px;padding:6px 2px 18px}
.x{width:34px;height:34px;border-radius:50%;color:var(--muted);font-size:22px;display:grid;place-items:center;flex:0 0 auto}
.x:active{background:var(--surface)}
.bar{flex:1;height:12px;border-radius:999px;background:var(--bg2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f0c268);
  border-radius:999px;transition:width .35s ease}

.prompt{font-weight:600;font-size:14px;color:var(--muted);margin:2px 2px 16px;letter-spacing:.02em}

.audiorow{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.speaker{width:78px;height:78px;border-radius:22px;flex:0 0 auto;
  background:linear-gradient(180deg,#2ca6cf,#1f7fa8);color:#eaf7fb;
  display:grid;place-items:center;box-shadow:0 6px 0 #185f80, 0 10px 22px rgba(0,0,0,.35);
  transition:transform var(--tap),box-shadow var(--tap)}
.speaker:active{transform:translateY(4px);box-shadow:0 2px 0 #185f80,0 6px 14px rgba(0,0,0,.3)}
.speaker svg{width:34px;height:34px}
.wave{flex:1;display:flex;align-items:center;gap:4px;height:40px;opacity:.8}
.wave span{flex:1;background:#2ca6cf;border-radius:3px;height:20%;animation:none;opacity:.55}
.playing .wave span{animation:pulse 1s ease-in-out infinite}
.slow{align-self:stretch;display:flex;align-items:center;padding:0 4px;color:var(--muted);
  font-size:12px;font-weight:700;letter-spacing:.08em}
.slow button{color:#2ca6cf;font-weight:700;letter-spacing:.06em;font-size:12px;padding:8px 6px}

/* assembly = ruled dictation lines */
.assembly{min-height:120px;display:flex;flex-direction:column;gap:16px;margin-bottom:8px}
.rule{border-bottom:2px solid var(--line);min-height:52px;display:flex;flex-wrap:wrap;gap:8px;
  align-content:flex-start;padding-bottom:8px}
.assembly.ok .rule{border-color:var(--correct)}
.assembly.bad .rule{border-color:var(--wrong)}

.spacer{flex:1;min-height:20px}

.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:16px 0 20px;min-height:64px}

.tile{
  background:var(--tile);color:var(--ink);border-radius:13px;
  padding:12px 16px;font-size:18px;font-weight:500;line-height:1;
  box-shadow:0 3px 0 var(--tile-press);border:1px solid rgba(0,0,0,.06);
  transition:transform var(--tap),box-shadow var(--tap),opacity var(--tap);
  animation:pop .18s both}
.tile:active{transform:translateY(3px);box-shadow:0 0 0 var(--tile-press)}
.tile.inplace{box-shadow:0 3px 0 var(--tile-press)}
.ghost{background:transparent;border:1px dashed transparent;box-shadow:none;
  border-radius:13px;padding:12px 16px;font-size:18px;font-weight:500;line-height:1;
  pointer-events:none;opacity:0}
.ghost.show{background:var(--bg2);opacity:1;border-color:var(--line)}
.assembly.ok .tile{background:#d9f2e8;box-shadow:0 3px 0 #b4e2d1}
.assembly.bad .tile{background:#f6ddd4;box-shadow:0 3px 0 #eabfb0}
.shake{animation:shake .4s}

.check-btn{
  flex:0 0 auto;margin:6px 2px 18px;padding:17px;border-radius:16px;width:100%;
  background:var(--accent);color:#3a2b06;font-weight:700;font-size:16px;letter-spacing:.03em;
  box-shadow:0 4px 0 var(--accent-press);transition:transform var(--tap),opacity var(--tap)}
.check-btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--accent-press)}
.check-btn[disabled]{background:var(--surface);color:var(--muted);box-shadow:0 4px 0 var(--bg2);opacity:.7}

/* result sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:520px;margin:0 auto;
  transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}
.sheet.up{transform:translateY(0)}
.sheet.good{background:#0f2f2a;box-shadow:0 -1px 0 var(--correct) inset}
.sheet.bad{background:#31201b;box-shadow:0 -1px 0 var(--wrong) inset}
.sheet .head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sheet .badge{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.good .badge{background:var(--correct);color:#08241d}
.bad .badge{background:var(--wrong);color:#2a0f08}
.sheet .title{font-size:19px;font-weight:700}
.good .title{color:var(--correct)} .bad .title{color:var(--wrong)}
.sheet .mean{color:var(--muted);font-size:13px;margin:0 0 2px;font-weight:600;letter-spacing:.03em}
.sheet .ru{font-size:17px;color:var(--text);margin:2px 0 18px;line-height:1.35}
.sheet .cont{width:100%;padding:16px;border-radius:14px;font-weight:700;font-size:16px;letter-spacing:.03em}
.good .cont{background:var(--correct);color:#062019;box-shadow:0 4px 0 #268266}
.bad .cont{background:var(--wrong);color:#2a0f08;box-shadow:0 4px 0 #ab4b34}
.sheet .cont:active{transform:translateY(4px)}

.done-card{margin:auto;text-align:center;padding:40px 24px}
.done-card .big{font-family:"GFS Didot",serif;font-size:40px;color:var(--accent);margin-bottom:8px}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{height:20%}50%{height:100%}}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <section id="home">
    <div class="brand">
      <h1 class="wordmark">Ακούω</h1>
      <span class="sub">tap what you hear · греческий</span>
      <button class="reset" id="reset">Clear progress</button>
    </div>
    <button class="randlesson" id="randLesson">
      <span class="rl-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M21 3 13 11"/><path d="M16 21h5v-5"/><path d="m15 15 6 6"/><path d="M3 4h4l14 16"/><path d="m3 20 6-6"/></svg>
      </span>
      <span class="rl-text">
        <span class="rl-title">Random lesson</span>
        <span class="rl-sub">jump into any lesson · случайный урок</span>
      </span>
      <span class="rl-go">→</span>
    </button>
    <div id="modules"></div>
  </section>

  <!-- PRACTICE -->
  <section id="practice">
    <div class="top">
      <button class="x" id="quit" aria-label="Close">✕</button>
      <div class="bar"><i id="prog" style="width:0%"></i></div>
    </div>
    <div id="stage"></div>
  </section>

  <!-- RESULT SHEET -->
  <div class="sheet" id="sheet">
    <div class="head">
      <div class="badge" id="badge"></div>
      <div class="title" id="sheetTitle"></div>
    </div>
    <div class="mean" id="meanLabel" style="display:none">Перевод</div>
    <div class="ru" id="ru"></div>
    <button class="cont" id="cont">Продолжить</button>
  </div>
</div>

/* progress persistence — guarded so it never breaks if storage is blocked */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let done = store.get("gk_done") || {};   // { "0-1": true } => module 0, lesson 1

/* ---- greek text-to-speech (word taps + fallback sentence audio) ---- */
let greekVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  greekVoice = vs.find(v=>/el(-|_)?/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
/* single-letter Greek words — the articles \u0397/\u03b7/\u039f/\u03bf and the conjunction \u0389/\u03ae ("or") —
   get narrated as letter names when spoken in isolation. So at the tile level we
   merge each with the word that follows it into one token ("\u039f \u039d\u03af\u03ba\u03bf\u03c2", "\u03ae \u03ba\u03ac\u03c1\u03c4\u03b1"):
   it shows as one tile and is voiced naturally. */
const ARTICLES = new Set(["\u0397","\u03b7","\u039f","\u03bf","\u0389","\u03ae"]);
function tokenize(greek){
  const raw = greek.trim().split(/\s+/), toks = [];
  for(let i=0;i<raw.length;i++){
    if(ARTICLES.has(raw[i]) && i+1<raw.length){ toks.push(raw[i]+" "+raw[i+1]); i++; }
    else toks.push(raw[i]);
  }
  return toks;
}
function speak(text, rate=1){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "el-GR"; u.rate = rate;
  if(greekVoice) u.voice = greekVoice;
  speechSynthesis.speak(u);
}

/* ---------- HOME ---------- */
function renderHome(){
  practiceEl.style.display="none"; homeEl.style.display="block";
  const wrap = $("#modules"); wrap.innerHTML="";
  DATA.modules.forEach((m, mi)=>{
    const md = document.createElement("div"); md.className="module"; md.style.animationDelay=(mi*.06)+"s";
    md.innerHTML = `<h2>${m.title} <span class="gk">${m.gk||""}</span></h2>
      <div class="count">${m.lessons.length} lessons</div>
      <div class="lessons"></div>`;
    const grid = md.querySelector(".lessons");
    m.lessons.forEach((l, li)=>{
      const key = mi+"-"+li, isDone = !!done[key];
      const b = document.createElement("button");
      b.className = "lesson"+(isDone?" done":"");
      b.innerHTML = `<div class="n">${isDone?"✓":(li+1)}</div>
        <div class="ttl">${l.title||("Lesson "+(li+1))}</div>
        <div class="meta">${l.sentences.length} sentences${isDone?' <span class="check">· done</span>':''}</div>`;
      b.onclick = ()=> startLesson(mi, li);
      grid.appendChild(b);
    });
    wrap.appendChild(md);
  });
}

/* ---------- PRACTICE STATE ---------- */
let S = null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function randomLesson(){
  const opts=[];
  DATA.modules.forEach((m,mi)=>m.lessons.forEach((l,li)=>opts.push([mi,li])));
  const [mi,li]=opts[(Math.random()*opts.length)|0];
  startLesson(mi,li);   // same flow; completing it ticks that lesson on the home page
}

function startLesson(mi, li){
  const lesson = DATA.modules[mi].lessons[li];
  S = { mi, li, queue: shuffle(lesson.sentences), idx:0 };
  homeEl.style.display="none"; practiceEl.style.display="flex";
  loadSentence();
}

function loadSentence(){
  hideSheet();
  const s = S.queue[S.idx];
  const correct = tokenize(s.greek);   // single-letter articles merge with the next word
  S.correct = correct;
  S.bank = correct.map((w,i)=>({id:i, word:w}));
  S.order = shuffle(S.bank);          // display order in the word bank
  S.used = new Set();                 // ids currently placed above
  S.placed = [];                      // ordered list of placed ids
  S.solved = false;
  prog.style.width = ((S.idx)/S.queue.length*100)+"%";
  drawStage(s);
  const ps=$("#pscroll"); if(ps) ps.scrollTop=0;   // always start showing the top bar
  playSentence();                     // auto-play on arrival
}

function drawStage(s){
  stage.innerHTML = `
    <div class="pscroll" id="pscroll">
    <div class="prompt">TAP WHAT YOU HEAR · нажми, что слышишь</div>
    <div class="audiorow" id="arow">
      <button class="speaker" id="play" aria-label="Play audio">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4a1 1 0 0 0 1.7-.7V5.7A1 1 0 0 0 11 5L7 9H4a1 1 0 0 0-1 1z"/><path d="M16 8.5a4 4 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M18.5 6a7 7 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div class="wave">${"<span></span>".repeat(14)}</div>
      <div class="slow"><button id="slow">SLOW</button></div>
    </div>
    <div class="assembly" id="assembly"><div class="rule" id="rule"></div></div>
    <div class="spacer"></div>
    <div class="bank" id="bank"></div>
    </div>
    <button class="check-btn" id="check" disabled>ПРОВЕРИТЬ</button>`;
  $("#play").onclick = ()=> playSentence();
  $("#slow").onclick = ()=> playSentence(true);
  $("#check").onclick = checkAnswer;
  drawRule(); drawBank();
}

function drawBank(){
  const bank = $("#bank"); bank.innerHTML="";
  S.order.forEach(item=>{
    if(S.used.has(item.id)){
      const g = document.createElement("div"); g.className="ghost show"; g.textContent=item.word;
      bank.appendChild(g);
    } else {
      const t = document.createElement("button"); t.className="tile"; t.textContent=item.word;
      t.onclick = ()=> placeWord(item.id);
      bank.appendChild(t);
    }
  });
}

function drawRule(){
  const rule = $("#rule"); rule.innerHTML="";
  S.placed.forEach(id=>{
    const w = S.bank[id].word;
    const t = document.createElement("button"); t.className="tile inplace"; t.textContent=w;
    t.onclick = ()=> removeWord(id);
    rule.appendChild(t);
  });
  const filled = S.placed.length, total = S.bank.length;
  $("#check").disabled = filled !== total || S.solved;
}

function placeWord(id){
  if(S.solved) return;
  S.used.add(id); S.placed.push(id);
  speak(S.bank[id].word);   // tokens already merge single-letter articles with their noun
  drawRule(); drawBank();
}
function removeWord(id){
  if(S.solved) return;
  S.used.delete(id);
  S.placed = S.placed.filter(x=>x!==id);
  $("#assembly").classList.remove("ok","bad");
  drawRule(); drawBank();
}

/* ---------- AUDIO ---------- */
let audioEl = null;
function playSentence(slow=false){
  const s = S.queue[S.idx];
  const arow = $("#arow"); if(arow){ arow.classList.add("playing"); setTimeout(()=>arow.classList.remove("playing"),1600); }
  if(s.audio){
    try{
      if(audioEl) audioEl.pause();
      audioEl = new Audio(AUDIO_DIR + s.audio);
      audioEl.playbackRate = slow ? 0.65 : 1;
      audioEl.play().catch(()=> speak(s.greek, slow?0.6:1));  // fallback to TTS if file missing/blocked
      return;
    }catch(e){}
  }
  speak(s.greek, slow?0.6:1);        // no recording → text-to-speech
}

/* ---------- CHECK ---------- */
function checkAnswer(){
  const s = S.queue[S.idx];
  const correct = S.correct;
  const answer = S.placed.map(id=>S.bank[id].word);
  const ok = answer.join(" ") === correct.join(" ");
  const asm = $("#assembly");
  if(ok){
    S.solved = true;
    asm.classList.add("ok");
    showSheet(true, s.ru);
  } else {
    asm.classList.add("bad");
    const rule = $("#rule"); rule.classList.add("shake"); setTimeout(()=>rule.classList.remove("shake"),400);
    showSheet(false, s.ru);
  }
}

/* ---------- RESULT SHEET ---------- */
function showSheet(good, ru){
  sheet.className = "sheet " + (good?"good":"bad");
  $("#badge").textContent = good ? "✓" : "✕";
  $("#sheetTitle").textContent = good ? "Σωστά! · Верно" : "Λάθος · Попробуй ещё";
  $("#meanLabel").style.display = good ? "block" : "none";
  $("#ru").textContent = good ? ru : "";
  $("#cont").textContent = good ? "Продолжить" : "Исправить";
  requestAnimationFrame(()=> sheet.classList.add("up"));
  $("#cont").onclick = good ? nextSentence : retry;
}
function hideSheet(){ sheet.classList.remove("up"); }
function retry(){
  hideSheet();
  $("#assembly").classList.remove("bad");
}
function nextSentence(){
  hideSheet();
  S.idx++;
  if(S.idx >= S.queue.length){ finishLesson(); return; }
  setTimeout(loadSentence, 220);
}
function finishLesson(){
  prog.style.width="100%";
  done[S.mi+"-"+S.li] = true; store.set("gk_done", done);
  stage.innerHTML = `<div class="done-card">
      <div class="big wordmark">Μπράβο!</div>
      <p style="color:var(--muted)">Урок пройден — ${S.queue.length} предложений.</p>
      <button class="check-btn" style="margin-top:22px" id="back">К урокам</button>
    </div>`;
  $("#back").onclick = renderHome;
}

$("#quit").onclick = ()=>{ hideSheet(); if(audioEl) audioEl.pause(); renderHome(); };
$("#randLesson").onclick = randomLesson;

let resetArmed=false, resetTimer=null;
function disarmReset(){ resetArmed=false; clearTimeout(resetTimer);
  const b=$("#reset"); if(b){ b.textContent="Clear progress"; b.classList.remove("arm"); } }
$("#reset").onclick = ()=>{
  const b=$("#reset");
  if(!resetArmed){
    resetArmed=true; b.textContent="Tap again to clear"; b.classList.add("arm");
    resetTimer=setTimeout(disarmReset, 2500);
    return;
  }
  disarmReset();
  done={}; store.set("gk_done", done); renderHome();
};

renderHome();
</script>
</body>
</html>
